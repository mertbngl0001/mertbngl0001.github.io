<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mert B. | Kişisel Web Sitem</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            z-index: 1;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }

        /* Yan taraftaki Domates */
        .tomato {
            position: fixed;
            right: 20px;
            bottom: 20px;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
        }
        .tomato:hover {
            transform: scale(1.2) rotate(15deg);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mert bingül</h1>
        <p>Bilişim Teknolojileri Öğrencisi</p>
        <p> Web siteme hoş geldiniz!</p>
    </div>

    <!-- Yan taraftaki Domates -->
    <div class="tomato" title="Mis gibi domates!">🍅</div>

</body>
</html>
